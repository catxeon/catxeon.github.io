<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Редактор коллекции карт</title>
<link rel="stylesheet" href="assets/editor.css">
</head>
<body>
<header>
  <strong>Коллекция банковских карт</strong>
  <span id="progress" class="muted"></span>
  <span class="spacer"></span>
  <span id="saved" class="muted">—</span>
  <button id="buildBtn" title="Собрать img/ и data/site.json из готовых карт">Собрать сайт</button>
</header>

<main>
  <aside id="list">
    <div class="filters">
      <input id="search" type="search" placeholder="поиск: банк, название, заметки…">
      <select id="filter">
        <option value="all">все карты</option>
        <option value="todo">не готовы</option>
        <option value="done">готовы</option>
        <option value="nomasks">без масок</option>
        <option value="single">без оборота</option>
      </select>
    </div>
    <ol id="cards"></ol>
    <div class="listfoot">
      <button id="addCard" title="Завести пустую карту">+ карта</button>
    </div>
  </aside>

  <section id="work">
    <div id="sides"></div>
  </section>

  <aside id="form">
    <div class="row"><label>Банк</label>
      <input id="f-bank" list="banks" autocomplete="off"><datalist id="banks"></datalist></div>
    <div class="row"><label>Страна</label>
      <input id="f-country" list="countries" autocomplete="off"><datalist id="countries"></datalist></div>
    <div class="row"><label>Платёжная система</label>
      <select id="f-network">
        <option value=""></option>
        <option>Мир</option><option>Visa</option><option>Mastercard</option>
        <option>UnionPay</option><option>American Express</option><option>JCB</option>
        <option>Мир/UnionPay</option><option>Мир/Maestro</option>
        <option>без платёжной системы</option>
      </select></div>
    <div class="row"><label>Тип</label>
      <select id="f-type">
        <option value=""></option>
        <option>дебетовая</option><option>кредитная</option><option>предоплаченная</option>
        <option>виртуальная</option><option>лояльность</option><option>транспортная</option>
        <option>другое</option>
      </select></div>
    <div class="row"><label>Название / серия</label><input id="f-title" autocomplete="off"></div>
    <div class="row"><label>Теги</label><input id="f-tags" placeholder="через запятую" autocomplete="off"></div>
    <div class="row"><label>Заметки</label><textarea id="f-notes" rows="4"></textarea></div>

    <div class="actions">
      <button id="copyPrev" title="Скопировать банк / страну / систему / тип из предыдущей карты">Поля как у предыдущей</button>
      <button id="doneBtn" class="primary">Готово <kbd>D</kbd></button>
    </div>
    <p class="hint">
      <kbd>←</kbd><kbd>→</kbd> — карта, <kbd>D</kbd> — готово, <kbd>R</kbd> — повернуть,
      <kbd>Ctrl</kbd>+<kbd>S</kbd> — сохранить.<br>
      Маска: протянуть мышью по картинке. Клик по маске — удалить.
    </p>
  </aside>
</main>

<div id="picker" hidden>
  <div class="pickbox">
    <div class="pickhead"><strong>Свободные сканы</strong><button id="pickClose">×</button></div>
    <div id="pickList"></div>
  </div>
</div>

<script src="assets/editor.js"></script>
</body>
</html>
